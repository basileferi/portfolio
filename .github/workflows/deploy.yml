name: Deploy to Infomaniak

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Hidden back-office URL (repository variable, optional).
          VITE_ADMIN_PATH: ${{ vars.ADMIN_PATH }}

      - name: Generate API config (DB credentials)
        run: node scripts/write-api-config.mjs
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ${{ github.workspace }}/dist/
          server-dir: /
          dry-run: false
          # Never touch images uploaded from the back office.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            uploads/projects/**
